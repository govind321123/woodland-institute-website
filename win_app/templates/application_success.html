<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application Submitted</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-box {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }

        .success-box h2 {
            color: #2ecc71;
            margin-bottom: 15px;
        }

        .success-box p {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
        }

        .success-box a {
            display: inline-block;
            padding: 12px 22px;
            background: linear-gradient(135deg, #6c63ff, #4e54c8);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .success-box a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="success-box">
    <h2>🎉 Application Submitted Successfully!</h2>
    <p>
        Thank you for applying.  
        Your application has been received and will be reviewed shortly.
    </p>

    <a href="/">Go to Home</a>
</div>

</body>
</html>
