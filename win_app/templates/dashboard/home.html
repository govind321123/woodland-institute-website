<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h1>Dashboard</h1>

<p><strong>Total Applications:</strong> {{ total_applications }}</p>

<h3>Recent Applications</h3>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
    </tr>

    {% for app in recent_applications %}
    <tr>
        <td>{{ app.name }}</td>
        <td>{{ app.email }}</td>
        <td>{{ app.course }}</td>
    </tr>
    {% endfor %}
</table>

<br><br>
<a href="/secretadmin/win_app/application/">Open Full Admin Panel</a>

</body>
</html>
