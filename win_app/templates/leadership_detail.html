{% extends "index.html" %}
{% load static %}

{% block content %}

<!-- Leadership Detail Section -->
<div class="container py-5">

    <div class="row align-items-start">

        <!-- LEFT IMAGE -->
        <div class="col-md-4">
            <img src="{{ leader.photo.url }}" 
                 class="img-fluid rounded shadow-sm"
                 style="max-height:400px; object-fit:cover;">
        </div>

        <!-- RIGHT CONTENT -->
        <div class="col-md-8">

            <h2 class="mb-2">{{ leader.name }}</h2>
            <p class="text-muted mb-3">
                <strong>{{ leader.designation }}</strong>
            </p>

            <p style="text-align: justify;">
                {{ leader.message }}
            </p>

        </div>

    </div>

</div>

{% endblock %}
